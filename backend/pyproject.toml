[project]
name = "interview-backend"
version = "0.1.0"
description = "AI SWE mock-interview platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "pdfplumber>=0.11",
  "pydantic>=2.9",
  "google-genai>=1.0",
  "groq>=0.13",
  "openai>=1.55",
  "faster-whisper>=1.1",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "fpdf2>=2.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
